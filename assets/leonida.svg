<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1300" width="1000" height="1300">
  <defs>
    <linearGradient id="mar" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b3954"/>
      <stop offset="0.55" stop-color="#0e4d6e"/>
      <stop offset="1" stop-color="#127a8f"/>
    </linearGradient>
    <radialGradient id="bajo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2bb3b1" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#2bb3b1" stop-opacity="0"/>
    </radialGradient>
    <pattern id="pantano" width="14" height="14" patternUnits="userSpaceOnUse">
      <rect width="14" height="14" fill="#3f6b3a"/>
      <circle cx="4" cy="4" r="1.6" fill="#5c8a4f"/>
      <circle cx="11" cy="10" r="1.2" fill="#2f5a3a"/>
      <path d="M1 12 q3 -2 6 0" stroke="#4f8a7a" stroke-width="0.8" fill="none"/>
    </pattern>
    <pattern id="cultivo" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(20)">
      <rect width="10" height="10" fill="#8a9a4a"/>
      <rect width="5" height="10" fill="#9aab55"/>
    </pattern>
    <pattern id="bosque" width="16" height="16" patternUnits="userSpaceOnUse">
      <rect width="16" height="16" fill="#2e5a34"/>
      <circle cx="5" cy="5" r="3.2" fill="#24492b"/>
      <circle cx="12" cy="12" r="3" fill="#356a3c"/>
    </pattern>
    <pattern id="ciudad" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="#b9b2a6"/>
      <rect x="0.8" y="0.8" width="6.4" height="6.4" fill="#cfc8bb"/>
    </pattern>
    <filter id="sombra" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#04222f" flood-opacity="0.55"/>
    </filter>
  </defs>

  <!-- Océano -->
  <rect width="1000" height="1300" fill="url(#mar)"/>
  <ellipse cx="600" cy="1180" rx="320" ry="90" fill="url(#bajo)"/>
  <ellipse cx="915" cy="880" rx="60" ry="200" fill="url(#bajo)"/>

  <!-- Tierra firme (Leonida) -->
  <path filter="url(#sombra)" fill="#d9cfa8" stroke="#f3ead0" stroke-width="3" d="
    M0,0 H1000 V40 C960,60 915,120 900,220 C885,330 875,430 870,520 C866,600 872,680 866,760
    C862,830 858,900 840,960 C822,1010 790,1050 745,1062 C700,1072 660,1045 625,1010
    C585,970 555,930 535,880 C505,810 490,740 478,660 C466,580 452,500 440,430
    C430,370 410,320 370,300 C320,280 250,292 180,290 C120,288 60,300 0,310 Z"/>

  <!-- Vegetación general -->
  <path fill="#a9b77a" opacity="0.55" d="M470,330 C560,300 700,300 860,280 L870,520 C760,540 600,520 470,520 Z"/>
  <!-- Mount Kalaga: bosque -->
  <path fill="url(#bosque)" d="M330,40 C430,20 640,20 760,50 C780,120 740,220 650,250 C560,270 430,260 360,220 C320,170 300,90 330,40 Z"/>
  <g fill="#6f6250" stroke="#efe6d2" stroke-width="1.5">
    <path d="M540,165 L572,112 L604,165 Z"/>
    <path d="M590,170 L615,130 L640,170 Z"/>
    <path d="M505,175 L528,140 L551,175 Z"/>
  </g>
  <path d="M564,125 L572,112 L580,125 Z" fill="#fff"/>

  <!-- Ambrosia: cultivos de caña -->
  <path fill="url(#cultivo)" opacity="0.9" d="M560,400 C620,380 720,385 780,410 C790,460 760,500 700,505 C640,510 580,500 560,470 Z"/>

  <!-- Lago Leonida -->
  <ellipse cx="660" cy="565" rx="54" ry="44" fill="#1d6f8c" stroke="#7fc8d8" stroke-width="2"/>
  <text x="660" y="569" font-family="Georgia, serif" font-size="11" font-style="italic" fill="#cdeef5" text-anchor="middle">Lago Leonida</text>

  <!-- Grassrivers: pantano -->
  <path fill="url(#pantano)" d="M520,760 C580,740 700,750 770,770 C775,850 760,930 740,1000 C700,1040 650,1020 610,980 C570,930 540,860 520,760 Z"/>
  <g stroke="#7fc8d8" stroke-width="1.4" fill="none" opacity="0.8">
    <path d="M560,790 C590,830 600,880 640,930 C660,960 690,980 720,1000"/>
    <path d="M640,780 C650,830 680,870 700,930"/>
    <path d="M700,770 C710,820 730,860 735,900"/>
  </g>

  <!-- Port Gellhorn: zona urbana -->
  <path fill="url(#ciudad)" d="M115,215 C170,205 260,205 300,220 L300,288 C250,292 180,290 120,289 Z" opacity="0.95"/>
  <!-- Millport y Watson Bay (pueblos) -->
  <circle cx="375" cy="238" r="16" fill="url(#ciudad)"/>
  <circle cx="515" cy="715" r="18" fill="url(#ciudad)"/>
  <circle cx="660" cy="450" r="16" fill="url(#ciudad)"/>

  <!-- Vice City metro -->
  <path fill="url(#ciudad)" d="M760,680 C800,670 850,670 868,680 L866,760 C862,830 858,900 845,955 C830,985 805,995 770,988 C760,900 755,780 760,680 Z"/>
  <!-- Aeropuerto VCIA -->
  <g transform="rotate(-12 742 868)">
    <rect x="712" y="850" width="62" height="36" rx="4" fill="#9c958a"/>
    <rect x="716" y="858" width="54" height="5" fill="#e8e2d6"/>
    <rect x="716" y="874" width="54" height="5" fill="#e8e2d6"/>
  </g>

  <!-- Bahía de Vice City (agua entre ciudad e isla de playa) -->
  <path fill="#14668a" d="M866,760 C872,800 870,860 862,930 L885,940 L886,770 Z" opacity="0.9"/>

  <!-- Rialto Islands / Port Vice City -->
  <g fill="#e2d8b4" stroke="#f6efd8" stroke-width="1.5">
    <ellipse cx="867" cy="810" rx="7" ry="5"/>
    <ellipse cx="871" cy="826" rx="9" ry="6"/>
    <ellipse cx="878" cy="850" rx="7" ry="5"/>
    <rect x="868" y="872" width="20" height="12" rx="3" fill="#bdb6aa"/>
  </g>
  <!-- Vice Beach (isla barrera) -->
  <path fill="#ecdcae" stroke="#fff6dd" stroke-width="2" d="M888,760 C896,758 906,765 908,790 C910,850 910,920 906,965 C904,978 894,980 890,968 C886,920 886,830 888,760 Z"/>
  <path d="M906,780 C909,850 909,920 905,966" stroke="#fff1c8" stroke-width="3" fill="none"/>

  <!-- Leonida Keys -->
  <g fill="#e6dab0" stroke="#fbf3da" stroke-width="1.5">
    <ellipse cx="760" cy="1078" rx="16" ry="6" transform="rotate(-25 760 1078)"/>
    <ellipse cx="724" cy="1100" rx="18" ry="6" transform="rotate(-25 724 1100)"/>
    <ellipse cx="688" cy="1124" rx="16" ry="6" transform="rotate(-30 688 1124)"/>
    <ellipse cx="628" cy="1165" rx="42" ry="14" transform="rotate(-18 628 1165)"/>
    <ellipse cx="560" cy="1200" rx="16" ry="6" transform="rotate(-12 560 1200)"/>
    <ellipse cx="488" cy="1222" rx="20" ry="7" transform="rotate(-8 488 1222)"/>
    <ellipse cx="418" cy="1243" rx="16" ry="7"/>
  </g>

  <!-- Carreteras -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path stroke="#f2b134" stroke-width="4" d="M60,262 C180,258 300,250 400,245 C500,240 560,280 600,330 C640,380 660,430 700,480 C740,540 760,600 790,670 C805,720 805,760 810,800"/>
    <path stroke="#f2b134" stroke-width="3.5" d="M810,800 C815,860 812,920 800,980 C780,1040 760,1060 740,1080 C700,1110 660,1140 620,1168 C580,1195 520,1215 418,1243" stroke-dasharray="1 0"/>
    <path stroke="#e7d9b0" stroke-width="2.5" d="M440,240 C470,300 520,330 560,345 C620,365 700,400 760,410"/>
    <path stroke="#e7d9b0" stroke-width="2.5" d="M600,330 C580,450 560,560 540,650 C530,690 520,710 515,715"/>
    <path stroke="#e7d9b0" stroke-width="2.5" d="M515,715 C580,720 680,740 760,760"/>
    <path stroke="#e7d9b0" stroke-width="2" d="M820,690 C850,690 860,700 866,700"/>
    <path stroke="#e7d9b0" stroke-width="2" d="M845,810 C860,812 868,815 890,820"/>
    <path stroke="#e7d9b0" stroke-width="2" d="M845,900 C860,895 875,885 890,880"/>
  </g>

  <!-- Nombres de región -->
  <g font-family="'Trebuchet MS', Arial, sans-serif" font-weight="700" text-anchor="middle" letter-spacing="3" fill="#fff" stroke="#0b2a38" stroke-width="3" paint-order="stroke">
    <text x="560" y="72" font-size="22">MOUNT KALAGA</text>
    <text x="560" y="92" font-size="11" letter-spacing="2">NATIONAL PARK</text>
    <text x="200" y="200" font-size="20">PORT GELLHORN</text>
    <text x="680" y="395" font-size="22">AMBROSIA</text>
    <text x="640" y="830" font-size="22">GRASSRIVERS</text>
    <text x="800" y="655" font-size="24">VICE CITY</text>
    <text x="560" y="1110" font-size="20">LEONIDA KEYS</text>
  </g>
  <!-- Nombres menores -->
  <g font-family="'Trebuchet MS', Arial, sans-serif" font-size="9.5" text-anchor="middle" fill="#14303b" font-weight="700">
    <text x="375" y="262">Millport</text>
    <text x="515" y="745">Watson Bay</text>
    <text x="905" y="745" fill="#fff6dd">Vice Beach</text>
    <text x="628" y="1190">Key Lento</text>
    <text x="488" y="1240" fill="#fff6dd">Maroon Key</text>
    <text x="418" y="1265" fill="#fff6dd">Catalan Key</text>
    <text x="545" y="358">Kelly County</text>
    <text x="905" y="470" fill="#fff6dd">Peregrine Bay</text>
    <text x="800" y="730">Hamlet</text>
    <text x="742" y="905">VCIA</text>
  </g>
  <g font-family="Georgia, serif" font-style="italic" font-size="20" fill="#7fc8d8" opacity="0.8" text-anchor="middle">
    <text x="230" y="520">Golfo de Leonida</text>
    <text x="955" y="330" transform="rotate(90 955 330)">Océano Atlántico</text>
  </g>

  <!-- Rosa de los vientos -->
  <g transform="translate(110 1170)" opacity="0.85">
    <circle r="34" fill="none" stroke="#7fc8d8" stroke-width="1.5"/>
    <path d="M0,-30 L7,0 L0,30 L-7,0 Z" fill="#fff"/>
    <path d="M-30,0 L0,7 L30,0 L0,-7 Z" fill="#7fc8d8"/>
    <text y="-40" font-family="Arial" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">N</text>
  </g>
  <text x="990" y="1292" font-family="Arial" font-size="9" fill="#9fd3df" text-anchor="end">Mapa ilustrativo hecho por fans · posiciones aproximadas</text>
</svg>
