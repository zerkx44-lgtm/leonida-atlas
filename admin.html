<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>Moderación — Leonida Atlas</title>
  <meta name="theme-color" content="#0b1d2a">
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/app.css?v=6">
  <link rel="stylesheet" href="css/admin.css?v=6">
</head>
<body class="admin">
  <header class="topbar">
    <a class="marca" href="./"><img src="assets/icon.svg" alt="" width="30" height="30"><span><b>Leonida</b> Atlas · Moderación</span></a>
    <div class="acciones">
      <span id="modo" class="tenue"></span>
      <button id="btn-salir" class="btn ghost" hidden>Salir</button>
    </div>
  </header>

  <main class="admin-main">
    <section id="login" class="tarjeta login" hidden>
      <h1>Entrar al panel</h1>
      <p class="tenue" id="login-ayuda"></p>
      <form id="form-login">
        <label class="campo" id="campo-email">Correo<input name="email" type="email" autocomplete="username"></label>
        <label class="campo"><span id="lbl-clave">Contraseña</span><input name="clave" type="password" autocomplete="current-password" required></label>
        <p class="error" id="login-error" hidden></p>
        <button class="btn primario" type="submit">Entrar</button>
      </form>
    </section>

    <section id="panel-admin" hidden>
      <nav class="tabs" role="tablist">
        <button role="tab" data-tab="pendiente" class="on">⏳ Pendientes <em id="n-pendiente">0</em></button>
        <button role="tab" data-tab="aprobado">✅ Publicados <em id="n-aprobado">0</em></button>
        <button role="tab" data-tab="rechazado">⛔ Rechazados <em id="n-rechazado">0</em></button>
        <button role="tab" data-tab="chat">💬 Chat <em id="n-chat">·</em></button>
        <button class="btn ghost" id="btn-recargar">↻ Recargar</button>
      </nav>
      <div id="cola" class="cola"></div>
    </section>
  </main>

  <dialog id="dlg-rechazo" class="dialogo">
    <form id="form-rechazo" method="dialog">
      <header class="dlg-cab"><h2>Rechazar aporte</h2><button type="button" class="cerrar" data-cerrar-dlg>✕</button></header>
      <label class="campo">Motivo (solo lo ven los moderadores)
        <select name="motivo">
          <option>Lenguaje ofensivo o grosero</option>
          <option>Spam o publicidad</option>
          <option>Datos personales</option>
          <option>Información falsa o duplicada</option>
          <option>No es sobre el juego</option>
          <option>Otro</option>
        </select>
      </label>
      <label class="campo">Nota<textarea name="nota" rows="2" maxlength="300"></textarea></label>
      <footer class="dlg-pie"><button type="button" class="btn ghost" data-cerrar-dlg>Cancelar</button><button class="btn primario" value="ok">Rechazar</button></footer>
    </form>
  </dialog>

  <div id="toast" class="toast" role="status" hidden></div>

  <script src="js/config.js?v=6"></script>
  <script src="js/data.js?v=6"></script>
  <script src="js/moderation.js?v=6"></script>
  <script src="js/store.js?v=6"></script>
  <script src="js/comun.js?v=6"></script>
  <script src="js/admin.js?v=6"></script>
</body>
</html>
